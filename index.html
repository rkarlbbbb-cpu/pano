<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4분할 메인</title>

<style>

/* =====================================================
   🎛️ 설정
   ===================================================== */
:root {

  /* 박스 사이 간격 */
  --gap: 10px;

  /* 이미지 위치 */
  --apt-pos: 80% center;
  --house-pos: 90% center;
  --park-pos: 50% center;
  --gallery-pos: 30% center;

  /* hover 확대 */
  --hover-scale: 1.08;

  /* 텍스트 */
  --text-bg: rgba(0,0,0,0.45);
  --text-color: #fff;
  --text-size: 16px;

  /* 모서리 */
  --radius: 18px;
}

/* =====================================================
   기본
   ===================================================== */

html,
body{
  margin:0;
  padding:0;
  height:100%;
  background:#e7f0ff;
  font-family:sans-serif;
}

/* =====================================================
   레이아웃
   ===================================================== */

.container{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:var(--gap);

  height:100vh;
  padding:var(--gap);
  box-sizing:border-box;
}

/* =====================================================
   공통 카드
   ===================================================== */

.section{
  position:relative;
  overflow:hidden;
  cursor:pointer;

  border-radius:var(--radius);

  transition:.3s;
}

.section:hover{
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.section img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.section:hover img{
  transform:scale(var(--hover-scale));
}

.section span{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);

  color:var(--text-color);
  background:var(--text-bg);

  padding:8px 14px;
  border-radius:6px;

  font-size:var(--text-size);
  white-space:nowrap;
}

/* =====================================================
   위치
   ===================================================== */

.left-top{
  grid-column:1;
  grid-row:1;
}

.left-bottom{
  grid-column:1;
  grid-row:2;
}

.center{
  grid-column:2;
  grid-row:1 / 3;
}

/* 오른쪽 전체 */
.gallery-full{
  grid-column:3;
  grid-row:1 / 3;
}

/* =====================================================
   이미지 위치
   ===================================================== */

.left-top img{
  object-position:var(--apt-pos);
}

.left-bottom img{
  object-position:var(--house-pos);
}

.center img{
  object-position:var(--park-pos);
}

.gallery-full img{
  object-position:var(--gallery-pos);
}

</style>
</head>

<body>

<div class="container">

  <!-- 아파트 -->
  <div class="section left-top"
       onclick="location.href='pages/apartment.html'">

    <img src="assets/img/apartment/main.jpg" alt="아파트">
    <span>아파트</span>

  </div>

  <!-- 이동식주택 -->
  <div class="section left-bottom"
       onclick="location.href='pages/house.html'">

    <img src="assets/img/house/main.jpg" alt="이동식주택">
    <span>이동식주택</span>

  </div>

  <!-- 공원 -->
  <div class="section center"
       onclick="location.href='pages/park.html'">

    <img src="assets/img/park/main.jpg" alt="공원">
    <span>공원</span>

  </div>

  <!-- 갤러리 (오른쪽 전체) -->
  <div class="section gallery-full"
       onclick="location.href='pages/gallery.html'">

    <img src="assets/img/gallery/main.jpg" alt="갤러리">
    <span>갤러리</span>

  </div>

</div>

</body>
</html>
