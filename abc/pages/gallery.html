<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>일반 갤러리</title><!-- 공통 CSS 연결 --><link rel="stylesheet" href="../css/common.css"><style> /* ===================================================== 전체 화면 및 배경 스타일 세팅 ===================================================== */ body { margin: 0; font-family: sans-serif; /* 기본 글자 모양 일괄 통일 */ background: #000; color: #fff; overflow: hidden; /* 스크롤바 완전 숨김 */ } .container { position: relative; width: 100vw; height: 100vh; overflow: hidden; } /* 배경 이미지 */ .container img.bg { width: 100%; height: 100%; object-fit: cover; /* 1.5초 대기 후 1초 동안 부드럽게 흐려짐 */ animation: blurBackground 1s ease-in-out forwards; animation-delay: 1.5s; } /* 배경 흐림 강도 및 무드 조절 애니메이션 효과 */ @keyframes blurBackground { to { filter: blur(5px) brightness(0.7); } } /* ===================================================== 왼쪽 상단 메뉴 버튼 스타일 (메인화면 단독) ===================================================== */ .top-right { position: absolute; top: 50px; left: 40px; display: flex; flex-direction: column; z-index: 10; /* 배경이 흐려질 때 타이밍에 맞춰 부드럽게 페이드인 등장 */ opacity: 0; animation: fadeInUI 1.6s ease-out forwards; animation-delay: 2.2s; } .top-right .btn { background: transparent; color: #333333; font-size: 15px; font-weight: bold; cursor: pointer; text-align: left; transition: color 0.2s ease; user-select: none; } .top-right .btn:hover { color: #000000; } /* 공통 UI 페이드인 애니메이션 정의 */ @keyframes fadeInUI { to { opacity: 1; } } /* ===================================================== 갤러리 4x2 그리드 레이아웃 세팅 ===================================================== */ .gallery-grid { position: absolute; top: 40px; left: 180px; right: 40px; bottom: 40px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; row-gap: 80px; /* 상하 이미지 세트 사이의 정중앙 간격 마진 */ column-gap: 20px; align-items: center; z-index: 5; /* 메뉴가 뜨는 속도와 싱크를 맞춰 아래에서 위로 스르륵 등장 */ opacity: 0; transform: translateY(30px); animation: fadeUpGallery 1.6s ease-out forwards; animation-delay: 2.2s; } /* 카드 배열용 위로 스르륵 페이드인 애니메이션 */ @keyframes fadeUpGallery { to { opacity: 1; transform: translateY(0); } } /* 개별 카드 전체 덩어리 컨테이너 */ .card-item { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; overflow: visible; } /* 이미지 개별 포장 박스 */ .img-box { position: relative; width: 100%; height: calc(100% - 20px); max-height: 220px; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.4); } /* 순수 이미지 스타일 */ .img-box img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.3s ease; display: block; } /* 마우스 호버 시 스티커(배지)는 고정되고, 이미지만 내부에서 싹 확대 */ .img-box:hover img { transform: scale(1.06); } /* ===================================================== 카드 좌측 상단 EXTERIOR / INTERIOR 배지 (스티커) ===================================================== */ .card-item::before { position: absolute; top: 15px; left: 12px; color: #fff; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 4px; z-index: 7; pointer-events: none; } /* 상단 구역: EXTERIOR (파란색 배지) */ .card-item.ext::before { content: "EXTERIOR"; background: #006699; } /* 하단 구역: INTERIOR (주황색 배지) */ .card-item.int::before { content: "INTERIOR"; background: #c6531e; } /* ===================================================== 💡 [완벽 통일] 1~4번 이미지 제목 라벨 통합 스타일 명세 ===================================================== */ .card-item .label { position: absolute; left: 0; bottom: -60px; /* row-gap 여백 공간의 정중앙에 수평 정렬하는 마진 축 */ width: 100%; height: 38px; line-height: 38px; text-align: center; /* 1-4번 서체, 크기, 자간, 굵기를 오차 없이 완벽하게 하나의 값으로 묶음 */ font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 14px; /* 글자 크기 14px 고정 */ font-weight: 900; /* 가장 두꺼운 두께 울트라볼드(Black) 고정 */ letter-spacing: -0.2px; /* 글자 밀도 자간 고정 */ text-transform: uppercase; /* 소문자 자동 대문자 변환 */ white-space: nowrap; /* 줄바꿈 강제 제한 */ border-radius: 4px; box-sizing: border-box; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); } /* 💡 배경색 조합 세팅 (1·3번 네이비 / 2·4번 하늘색) */ .label.navy-1, .label.navy-3 { background: #0c2340 !important; color: #ffffff !important; } .label.sky-2, .label.sky-4 { background: #0076a3 !important; color: #ffffff !important; }</style></head><body><div class="container"> <!-- 배경 이미지 --> <img src="../assets/img/gallery/main.jpg" class="bg"> <!-- 왼쪽 버튼 그룹 --> <div class="top-right"> <div class="btn" id="closeBtn">메인화면</div> </div> <!-- 갤러리 격자 배열 전체 영역 --> <div class="gallery-grid"> <!-- [상단 EXTERIOR 구역 1~4번] --> <div class="card-item ext"> <div class="img-box"> <img src="../assets/img/gallery/Img01.jpg"> </div> <div class="label navy-1">01. EDUCATION SPACE</div> </div> <div class="card-item ext"> <div class="img-box"> <img src="../assets/img/gallery/Img02.jpg"> </div> <div class="label sky-2">02. CULTURE & ART SPACE</div> </div> <div class="card-item ext"> <div class="img-box"> <img src="../assets/img/gallery/Img03.jpg"> </div> <div class="label navy-3">03. HIGH-END HOSPITALITY</div> </div> <div class="card-item ext"> <div class="img-box"> <img src="../assets/img/gallery/Img04.jpg"> </div> <div class="label sky-4">04. FOREST ECO RESORT</div> </div> <!-- [하단 INTERIOR 구역 5~8번] --> <div class="card-item int"> <div class="img-box"> <img src="../assets/img/gallery/Img05.jpg"> </div> </div> <div class="card-item int"> <div class="img-box"> <img src="../assets/img/gallery/Img06.jpg"> </div> </div> <div class="card-item int"> <div class="img-box"> <img src="../assets/img/gallery/Img07.jpg"> </div> </div> <div class="card-item int"> <div class="img-box"> <img src="../assets/img/gallery/Img08.jpg"> </div> </div> </div></div> <!-- .container 끝 --><!-- 공통 자바스크립트 스크립트 파일 연결 --><script src="../js/common.js"></script></body></html>
