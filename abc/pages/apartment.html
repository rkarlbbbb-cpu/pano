<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>아파트 포트폴리오</title>

<!-- 💡 공통 CSS 연결 -->
<link rel="stylesheet" href="../css/common.css">

<!-- ⚡ 팝업 좌우 화살표, 슬라이더 및 페이지 번호 스타일 추가 -->
<style>
  /* 팝업이 떴을 때 스타일 확장 */
  .popup.active {
    display: flex !important;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85) !important; /* 배경을 더 어둡게 하여 이미지 강조 */
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }

  .gallery-content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90%;
    max-width: 1000px;
  }

  /* ⚡ 좌우 이동 화살표 버튼 스타일 */
  .popup-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 10000;
    user-select: none;
  }

  .popup-nav-btn:hover {
    background: rgba(255, 255, 255, 0.8);
    color: #000;
    transform: translateY(-50%) scale(1.1);
  }

  .popup-nav-btn.prev { left: -70px; }
  .popup-nav-btn.next { right: -70px; }

  /* 화면이 작아질 때 화살표 위치 조정 (모바일 대책) */
  @media (max-width: 1200px) {
    .popup-nav-btn.prev { left: 10px; }
    .popup-nav-btn.next { right: 10px; }
  }

  /* 닫기 버튼 스타일 보완 */
  .popup-close-zone {
    position: absolute;
    top: -40px;
    right: 0;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    background: rgba(0,0,0,0.5);
    padding: 5px 12px;
    border-radius: 4px;
  }

  /* ⚡ 이미지 페이지 번호 표시 스타일 (예: 3 / 9) */
  .popup-counter {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.6);
    padding: 6px 16px;
    border-radius: 20px;
    letter-spacing: 1px;
    user-select: none;
  }

  /* ⚡ [짤림 및 라운딩 해결] 이미지를 감싸는 부모 박스에 10px 곡률을 주어 삐져나오는 모서리를 강제로 깎아냅니다 */
  .main-img-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px !important; /* ⚡ 팝업 원본 규격인 10px 일치화 */
    overflow: hidden !important;    /* ⚡ 둥글게 깎인 영역 밖으로 이미지가 못 튀어나가게 잠금 */
  }

  /* ⚡ [확대 이미지 스타일] 비율 유지 및 10px 라운드 강제 고정 */
  #popupMainImg.main-img {
    width: 100% !important;
    height: auto !important;
    max-height: 75vh !important; /* 모니터 세로 화면을 벗어나지 않도록 안전 제한 설정 */
    object-fit: contain !important; /* 가로세로 비율 왜곡 없이 원본 그대로 쏙 맞춤 */
    border-radius: 10px !important; /* ⚡ 부모 박스와 똑같이 10px 처리 */
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4) !important;
    display: block !important;
  }
</style>

</head>

<body>

<div class="container">

  <!-- 배경 이미지 -->
  <img src="../assets/img/apartment/main.jpg" class="bg">

  <!-- 왼쪽 버튼 -->
  <div class="left-buttons">

    <!-- 💡 VR 주소만 요청하신 전용 링크로 완벽하게 교체되었습니다. 외부 파일 함수 의존성 및 특수문자 깨짐이 전혀 발생하지 않는 표준 방식으로 실행됩니다. -->
    <div class="btn"
         id="vrBtn"
         onclick="const vrUrl = String.raw`https://pano-f4jz-rj751dl8r-rkarlbbbb-9627s-projects.vercel.app/pano/apt0/`; setActiveButton('vrBtn'); window.open(vrUrl, '_blank', 'width=1200,height=800');">

      <img src="../assets/icon/play.svg">
      VR 투어

    </div>

  </div>

  <!-- 오른쪽 버튼 (전체화면 버튼 안보이게 제거 완료) -->
  <div class="top-right">

    <div class="btn"
         id="closeBtn">

      메인화면

    </div>

  </div>

  <!-- ✅ 갤러리 (카드형 바둑판 배열) -->
  <div class="gallery-grid" id="galleryGrid">

    <img src="../assets/img/apartment/apt0.jpg" alt="아파트 이미지 0">
    <img src="../assets/img/apartment/apt1.jpg" alt="아파트 이미지 1">
    <img src="../assets/img/apartment/apt2.jpg" alt="아파트 이미지 2">
    <img src="../assets/img/apartment/apt3.jpg" alt="아파트 이미지 3">
    <img src="../assets/img/apartment/apt4.jpg" alt="아파트 이미지 4">
    <img src="../assets/img/apartment/apt5.jpg" alt="아파트 이미지 5">
    <img src="../assets/img/apartment/apt6.jpg" alt="아파트 이미지 6">
    <img src="../assets/img/apartment/apt7.jpg" alt="아파트 이미지 7">
    <img src="../assets/img/apartment/apt8.jpg" alt="아파트 이미지 8">
    <img src="../assets/img/apartment/apt9.jpg" alt="아파트 이미지 9">

  </div>

</div> <!-- .container 끝 -->


<!-- ⚡ 확대 보기 전용 내장 팝업 구조 (화살표 및 카운터 추가) -->
<div class="popup" id="customPopup" style="display: none;">
  <div class="gallery-content">
    <div class="popup-close-zone" id="popupCloseBtn">닫기 ✕</div>
    
    <!-- ⚡ 이미지 번호 표시기 -->
    <div class="popup-counter" id="popupCounter">1 / 10</div>
    
    <!-- ◀ 왼쪽 화살표 -->
    <button class="popup-nav-btn prev" id="popupPrevBtn">❮</button>
    
    <div class="main-img-wrapper">
      <img src="" class="main-img" id="popupMainImg">
    </div>
    
    <!-- ▶ 오른쪽 화살표 -->
    <button class="popup-nav-btn next" id="popupNextBtn">❯</button>
  </div>
</div>


<!-- 💡 공통 자바스크립트 연결 -->
<script src="../js/common.js"></script>


<!-- ⚡ 아파트 페이지 전용 독립형 슬라이더 및 카운터 스크립트 실행 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const gridImages = Array.from(document.querySelectorAll("#galleryGrid img"));
    const popup = document.getElementById("customPopup");
    const popupImg = document.getElementById("popupMainImg");
    const closeBtn = document.getElementById("popupCloseBtn");
    const prevBtn = document.getElementById("popupPrevBtn");
    const nextBtn = document.getElementById("popupNextBtn");
    const counter = document.getElementById("popupCounter");
    
    let currentIndex = 0;

    // ⚡ 번호 업데이트 함수
    function updateCounter() {
      counter.innerText = `${currentIndex + 1} / ${gridImages.length}`;
    }

    // 팝업 열기 함수
    function openPopup(index) {
      currentIndex = index;
      popupImg.src = gridImages[currentIndex].src;
      updateCounter(); // 열릴 때 번호 갱신
      popup.classList.add("active");
    }

    // 팝업 닫기 함수
    function closePopup() {
      popup.classList.remove("active");
    }

    // 이전 이미지로 이동
    function prevImage(e) {
      if(e) e.stopPropagation();
      currentIndex = (currentIndex === 0) ? gridImages.length - 1 : currentIndex - 1;
      popupImg.src = gridImages[currentIndex].src;
      updateCounter(); // 바뀔 때 번호 갱신
    }

    // 다음 이미지로 이동
    function nextImage(e) {
      if(e) e.stopPropagation();
      currentIndex = (currentIndex === gridImages.length - 1) ? 0 : currentIndex + 1;
      popupImg.src = gridImages[currentIndex].src;
      updateCounter(); // 바뀔 때 번호 갱신
    }

    // 1. 그리드 이미지 클릭 시 팝업 띄우기 세팅
    gridImages.forEach((img, index) => {
      img.addEventListener("click", (e) => {
        e.stopPropagation(); // 기존 common.js 이벤트와 충돌 방지
        openPopup(index);
      });
    });

    // 2. 버튼 클릭 이벤트 연결
    prevBtn.addEventListener("click", prevImage);
    nextBtn.addEventListener("click", nextImage);
    closeBtn.addEventListener("click", closePopup);
    popup.addEventListener("click", closePopup); // 배경 누르면 닫히기
    popupImg.addEventListener("click", (e) => e.stopPropagation()); // 이미지 클릭 시엔 안닫히기

    // 3. 키보드 방향키 및 ESC 지원 추가
    document.addEventListener("keydown", (e) => {
      if (!popup.classList.contains("active")) return;
      if (e.key === "ArrowLeft") prevImage();
      if (e.key === "ArrowRight") nextImage();
      if (e.key === "Escape") closePopup();
    });
  });
</script>

</body>
</html>
